name = "Blake3Servil"
defaultTargets = ["Generic", "Bridge", "Term", "Sound", "Algorithms"]

[[require]]
name = "Blake3"
path = "../../../c2sp/BLAKE3"

[[lean_lib]]
name = "Generic"

[[lean_lib]]
name = "Bridge"

[[lean_lib]]
name = "Term"

[[lean_lib]]
name = "Sound"

# The tree algorithms the library uses, proved to compute the specification's tree.
[[lean_lib]]
name = "Algorithms"

# test_vectors/lean_vectors.json (Vectors.lean): compiled, since the interpreter takes
# minutes over the inputs.
[[lean_exe]]
name = "vectors"
root = "Vectors"
